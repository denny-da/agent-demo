name: GitHub AI Daily

on:
  schedule:
    # 09:30 Asia/Shanghai = 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-ai-daily
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and email report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: qwei02476@gmail.com
        run: python scripts/github_ai_daily.py

      - name: Save report snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json reports/latest.md
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: update GitHub AI daily snapshot"
            git push
          fi
